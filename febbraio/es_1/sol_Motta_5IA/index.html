<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ricerca eventi per provincia</h1>
    <form action="/eventi" method="get">
        <select id="selector" name="provincia">
            <option value="BG">Bergamo</option>
            <option value="BS">Brescia</option>
            <option value="CO">Como</option>
            <option value="CR">Cremona</option>
            <option value="LC">Lecco</option>
            <option value="LO">Lodi</option>
            <option value="MB">Monza e Brianza</option>
            <option value="MI">Milano</option>
            <option value="PV">Pavia</option>
            <option value="SO">Sondrio</option>
            <option value="VA">Varese</option>
        </select>
        <button type="submit">Cerca</button>
    </form>

    <h1>Crea nuovo evento</h1>
    <form action="/eventi" method="post">
        <label for="titolo">Titolo</label>
        <input name="titolo" type="text">
        <label for="data">Data (formato /)</label>
        <input name="data" type="text">
        <label for="comune">Comune</label>
        <input name="comune" type="text">
        <label for="provincia">Provincia</label>
        <input name="provincia" type="text">
        <button type="submit">Registra evento</button>
    </form>
    
</body>
</html>
