<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dati centri sporitivi Lombardia</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 5px;
        }
    </style>
</head>
<body>
    <table id="elenco">
        <thead>
            <th>Denominazione</th><th>Comune</th><th>Via</th>
        </thead>
    </table>
    <button id="datiBtn" onclick="caricaDati()">Carica dati</button><br>
    <label for="province">Vedi solo dati per:</label>
    <select id="province">
        <option value="BG">Bergamo</option>
        <option value="BS">Brescia</option>
        <option value="CO">Como</option>
        <option value="CR">Cremona</option>
        <option value="LC">Lecco</option>
        <option value="LO">Lodi</option>
        <option value="MB">Monza e Brianza</option>
        <option value="MI">Milano</option>
        <option value="MN">Mantova</option>
        <option value="PV">Pavia</option>
        <option value="SO">Sondrio</option>
        <option value="VA">Varese</option>
    </select><br>
    <button id="filtroBtn" onclick="applicaFiltro(document.getElementById('province').value)">Applica filtro</button>
    <script>
        async function caricaDati() {
            let x = await fetch("https://www.dati.lombardia.it/resource/qkfs-wmmh.json?$limit=50000");
            let centri = await x.json();
            let tabella = document.getElementById("elenco");
            tabella.innerHTML = '<thead><th>Denominazione</th><th>Comune</th><th>Via</th></thead>';
            centri.forEach(c => {
                let riga = document.createElement("tr");
                riga.innerHTML = '<td>'+c.denominazione_centro+'</td><td>'+c.comune+'</td><td>'+c.indirizzo+'</td>';
                tabella.appendChild(riga);
            });
        }
        async function applicaFiltro(provincia) {
            let x = await fetch("https://www.dati.lombardia.it/resource/qkfs-wmmh.json?$limit=50000&provincia="+provincia);
            let centri = await x.json();
            let tabella = document.getElementById("elenco");
            tabella.innerHTML = '<thead><th>Denominazione</th><th>Comune</th><th>Via</th></thead>';
            centri.forEach(c => {
                let riga = document.createElement("tr");
                riga.innerHTML = '<td>'+c.denominazione_centro+'</td><td>'+c.comune+'</td><td>'+c.indirizzo+'</td>';
                tabella.appendChild(riga);
            });
            
        }
    </script>
</body>
</html>
